<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prabowo Speeches Discourse Dashboard</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, "Times New Roman", serif;
      background: #f4f1ea;
      color: #1b1a16;
      letter-spacing: 0.01em;
    }

    a {
      color: #9a2b27;
      font-weight: 600;
    }
  </style>
  <script>
    const target = window.matchMedia("(max-width: 760px)").matches
      ? "mobile_dashboard/index.html"
      : "interactive_dashboard/index.html";
    window.location.replace(target);
  </script>
</head>
<body>
  <main>
    Opening the dashboard.
    <a href="mobile_dashboard/index.html">Mobile version</a> |
    <a href="interactive_dashboard/index.html">Desktop version</a>
  </main>
</body>
</html>
